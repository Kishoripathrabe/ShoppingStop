<div class="container mt-5" *ngIf="showinactivityFlag; else active" >
    <div class="modal d-block" id="inactivityModal"  aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Inactivity Warning</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            You have been inactive for a while.
            Do you want to LogOut?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="inactivityModal" (click)="logOutme()" >Yes</button>
            <button type="button" class="btn btn-primary" data-bs-dismiss="inactivityModal" (click)="contMe()">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </div>
